[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-edge"
version = "0.1.0"
description = "Raspberry Pi gateway bridging a ZKTeco F18 terminal to the Atlas platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyzk>=0.9",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov"]

[project.scripts]
atlas-edge-listener = "atlas_edge.listener:main"
atlas-edge-web = "atlas_edge.web.__main__:main"

[tool.setuptools.packages.find]
include = ["atlas_edge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
